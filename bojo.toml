schema = 1

[project]
name    = "bojo_demo"
version = "0.1.0"
entry   = "main.mojo"

[version]
mojo = "1.2.0"

[build]
output = "dir"
strip  = true

# Bootstrap smoke-test dependency; additional bojolib libraries (io, socket,
# http, ...) are added here as they ship.
[deps-from."https://github.com/bojolib/bojo_libtemplate"]
version = "v0.2.0"

# Only the root project may shorten a module path, and only here, keyed by
# canonical module path. Libraries always write full module paths.
[alias]
"gh.bojolib.bojo_libtemplate" = "greeting"

# Root-only conflict resolution and fork replacement (never allowed in
# libraries). Dependency resolution is strict by default (D69: no silent
# upgrades); resolve diamond conflicts or point at a fork explicitly here:
#
# [override."gh.bojolib.socket"]
# version = "v0.2.1"
#
# [replace."gh.bojolib.socket"]
# repo    = "https://github.com/example/socket-fork"
# version = "v0.2.1"
